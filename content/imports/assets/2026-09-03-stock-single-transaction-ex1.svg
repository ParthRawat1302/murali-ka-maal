<text x="280" y="96" text-anchor="middle" font-size="12" fill="#888">5</text>
<line x1="120" y1="130" x2="120" y2="106" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="120" y="146" text-anchor="middle" font-size="13" fill="#333">buy</text>
